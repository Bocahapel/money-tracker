@if (showModal) {
  <div>
    <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
      <div
        class="fixed top-0 right-0 h-full w-80 bg-[#1a1a1c] border-l border-[#2c2c2a] z-50 p-6 flex flex-col"
      >
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-base font-medium text-[#FFFFF5]">
            {{ isEditing ? 'Edit Transaction' : 'Add Transaction' }}
          </h2>
          <button
            (click)="onCancel()"
            class="text-[#A32D2D] hover:text-[#e35656] text-lg leading-none"
          >
            ✕
          </button>
        </div>

        <div class="mb-3.5">
          <label class="text-xs text-[#888780] block mb-2">Type</label>
          <div class="grid grid-cols-2 gap-1.5">
            <button
              (click)="initialTransaction.type = 'income'"
              [ngClass]="
                initialTransaction.type === 'income'
                  ? 'border-[#1D9E75] bg-[#04342C] text-[#5DCAA5]'
                  : 'border-[#2c2c2a] bg-[#0f0f10] text-[#888780]'
              "
              class="py-2 rounded-lg border text-sm transition-colors"
            >
              Income
            </button>
            <button
              (click)="initialTransaction.type = 'expense'"
              [ngClass]="
                initialTransaction.type === 'expense'
                  ? 'border-[#A32D2D] bg-[#501313] text-[#F09595]'
                  : 'border-[#2c2c2a] bg-[#0f0f10] text-[#888780]'
              "
              class="py-2 rounded-lg border text-sm transition-colors"
            >
              Expense
            </button>
          </div>
        </div>
      </div>
      <button (click)="onCancel()">Cancel</button>
    </div>
  </div>
}
