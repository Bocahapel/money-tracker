@if (showModal) {
  <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div
      class="fixed top-0 right-0 h-full w-[500px] bg-[#1a1a1c] border-l border-[#2c2c2a] z-50 p-6 flex flex-col"
    >
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-base font-medium text-[#FFFFF5]">
          {{ isEditing ? 'Edit Transaction' : 'Add Transaction' }}
        </h2>
        <button
          (click)="onCancel()"
          class="text-[#A32D2D] hover:text-[#e35656] text-lg leading-none"
        >
          ✕
        </button>
      </div>

      <div class="mb-3.5">
        <label class="text-xs text-[#888780] block mb-2">Type</label>
        <div class="grid grid-cols-2 gap-1.5">
          <button
            (click)="initialTransaction.type = 'income'"
            [ngClass]="
              initialTransaction.type === 'income'
                ? 'border-[#1D9E75] bg-[#04342C] text-[#5DCAA5]'
                : 'border-[#2c2c2a] bg-[#0f0f10] text-[#888780]'
            "
            class="py-2 rounded-lg border text-sm transition-colors"
          >
            Income
          </button>
          <button
            (click)="initialTransaction.type = 'expense'"
            [ngClass]="
              initialTransaction.type === 'expense'
                ? 'border-[#A32D2D] bg-[#501313] text-[#F09595]'
                : 'border-[#2c2c2a] bg-[#0f0f10] text-[#888780]'
            "
            class="py-2 rounded-lg border text-sm transition-colors"
          >
            Expense
          </button>
        </div>
      </div>

      <div class="mb-3.5">
        <label class="text-xs text-[#888780] block mb-2">Category</label>
        <input
          [(ngModel)]="initialTransaction.category"
          type="text"
          placeholder="e.g. groceries, salary"
          #categoryInput
          (focus)="focusedField = 'category'"
          (blur)="focusedField = ''"
          [ngClass]="
            focusedField === 'category' && initialTransaction.type === 'expense'
              ? 'border-[#A32D2D]'
              : focusedField === 'category'
                ? 'border-[#1D9E75]'
                : 'border-[#2c2c2a]'
          "
          class="w-full bg-[#0f0f10] border rounded-lg px-3 py-2.5 text-sm text-[#e8e6e0] outline-none"
        />
      </div>
      <div class="mb-3.5">
        <label class="text-xs text-[#888780] block mb-2">Amount (Rp)</label>
        <input
          [(ngModel)]="initialTransaction.amount"
          type="number"
          placeholder="0"
          #amountInput
          (focus)="focusedField = 'amount'"
          (blur)="focusedField = ''"
          [ngClass]="
            focusedField === 'amount' && initialTransaction.type === 'expense'
              ? 'border-[#A32D2D]'
              : focusedField === 'amount'
                ? 'border-[#1D9E75]'
                : 'border-[#2c2c2a]'
          "
          class="w-full bg-[#0f0f10] border rounded-lg px-3 py-2.5 text-sm text-[#e8e6e0] outline-none"
        />
      </div>
      <div class="mb-3.5">
        <label class="text-xs text-[#888780] block mb-2">Date</label>
        <input
          [(ngModel)]="initialTransaction.date"
          type="date"
          #dateInput
          (focus)="focusedField = 'date'"
          (blur)="focusedField = ''"
          [ngClass]="
            focusedField === 'date' && initialTransaction.type === 'expense'
              ? 'border-[#A32D2D]'
              : focusedField === 'date'
                ? 'border-[#1D9E75]'
                : 'border-[#2c2c2a]'
          "
          class="w-full bg-[#0f0f10] border rounded-lg px-3 py-2.5 text-sm text-[#e8e6e0] outline-none"
        />
      </div>
      <div class="mb-5">
        <label class="text-xs text-[#888780] block mb-2">Source</label>
        <input
          [(ngModel)]="initialTransaction.source"
          type="text"
          placeholder="Source"
          #noteInput
          (focus)="focusedField = 'Source'"
          (blur)="focusedField = ''"
          [ngClass]="
            focusedField === 'Source' && initialTransaction.type === 'expense'
              ? 'border-[#A32D2D]'
              : focusedField === 'Source'
                ? 'border-[#1D9E75]'
                : 'border-[#2c2c2a]'
          "
          class="w-full bg-[#0f0f10] border rounded-lg px-3 py-2.5 text-sm text-[#e8e6e0] outline-none"
        />
      </div>
      <div class="mb-5">
        <label class="text-xs text-[#888780] block mb-2">Note</label>
        <input
          [(ngModel)]="initialTransaction.note"
          type="text"
          placeholder="Optional note"
          #noteInput
          (focus)="focusedField = 'note'"
          (blur)="focusedField = ''"
          [ngClass]="
            focusedField === 'note' && initialTransaction.type === 'expense'
              ? 'border-[#A32D2D]'
              : focusedField === 'note'
                ? 'border-[#1D9E75]'
                : 'border-[#2c2c2a]'
          "
          class="w-full bg-[#0f0f10] border rounded-lg px-3 py-2.5 text-sm text-[#e8e6e0] outline-none"
        />
      </div>

      <div class="flex gap-2">
        <button
          (click)="onCancel()"
          class="flex-1 py-2.5 rounded-lg border border-[#2c2c2a] bg-[#0f0f10] text-sm text-[#888780] hover:bg-[#2c2c2a] transition-colors"
        >
          Cancel
        </button>
        <button
          (click)="onSave()"
          class="flex-1 py-2.5 rounded-lg bg-[#1D9E75] hover:bg-[#0F6E56] text-sm font-medium text-[#E1F5EE] transition-colors"
        >
          Save
        </button>
      </div>
    </div>

    <!-- click outside to close -->
    <div class="absolute inset-0 -z-10" (click)="onCancel()"></div>
  </div>
}
